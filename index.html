<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · CCS Virtual Office Dashboard</title>
<link rel="stylesheet" href="assets/style.css?v=14">
</head>
<body>

<div class="login-screen">
  <form class="login-card" id="login-form" autocomplete="off">
    <h1 class="login-title">CCS Virtual Office Dashboard</h1>
    <p class="login-subtitle">Sign in to view operations data.</p>
    <label class="login-field">
      <span>Username</span>
      <input type="text" id="login-username" autocomplete="username" required>
    </label>
    <label class="login-field">
      <span>Password</span>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <p class="login-error" id="login-error" hidden></p>
    <button type="submit" class="login-submit" id="login-submit">Log in</button>
  </form>
</div>

<script src="assets/auth.js?v=1"></script>
</body>
</html>
