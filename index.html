<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{var ct=localStorage.getItem('ccs-theme')||localStorage.getItem('ccs-vo-theme');if(ct==='light'||ct==='dark')document.documentElement.setAttribute('data-theme',ct)}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b5d45'/%3E%3Cpath d='M8 22V13M14 22V9M20 22V16M26 22V11' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<title>Sign In · CCS Virtual Office Dashboard</title>
<link rel="stylesheet" href="https://zefanonuevo.github.io/ccs-design/ccs-tokens.css?v=2">
<link rel="stylesheet" href="assets/style.css?v=16">
</head>
<body>

<div class="login-theme"><div class="theme" id="theme" role="radiogroup" aria-label="Color theme"><button type="button" role="radio" data-theme-set="system" aria-checked="true" aria-label="System theme" title="System"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 14h5M8 11.5V14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg></button><button type="button" role="radio" data-theme-set="light" aria-checked="false" aria-label="Light theme" title="Light"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="2.9" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg></button><button type="button" role="radio" data-theme-set="dark" aria-checked="false" aria-label="Dark theme" title="Dark"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button></div></div>

<div class="login-screen">
  <form class="login-card" id="login-form" autocomplete="off">
    <h1 class="login-title">CCS Virtual Office Dashboard</h1>
    <p class="login-subtitle">Sign in to view operations data.</p>
    <label class="login-field">
      <span>Username</span>
      <input type="text" id="login-username" autocomplete="username" required>
    </label>
    <label class="login-field">
      <span>Password</span>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <p class="login-error" id="login-error" hidden></p>
    <button type="submit" class="login-submit" id="login-submit">Log in</button>
  </form>
</div>

<script src="assets/shell.js?v=1"></script>
<script src="assets/auth.js?v=1"></script>
</body>
</html>
